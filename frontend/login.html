<!-- frontend/login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CYVORA — Sign In / Create Account</title>
  <link rel="stylesheet" href="assets/css/threat-scan.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .auth-logo{display:block;width:min(260px,80%);height:auto;margin:0 auto 16px;}
    .auth-wrapper {
      max-width: 440px;
      margin: 48px auto;
    }
    .auth-field {
      margin-bottom: 12px;
    }
    .auth-field label {
      display: block;
      margin-bottom: 4px;
      font-size: 0.9rem;
    }
    .auth-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }
    .auth-actions .btn {
      flex: 1;
    }
  </style>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0b1020">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CYVORA">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="assets/icons/cyvora-icon.svg">
</head>
<body>
  <div class="cyvora-shell auth-wrapper">
    <div class="card">
      <img src="assets/images/cyvora-logo.jpeg" alt="CYVORA" class="auth-logo"><h1 class="brand-title">CYVORA</h1>
      <p class="brand-sub" style="margin-bottom:18px;">
        Sign in or create an account to access ThreatScan
      </p>

      <div class="tabs" role="tablist">
        <button type="button" class="tab-btn active" data-mode="login">Sign In</button>
        <button type="button" class="tab-btn" data-mode="signup">Sign Up</button>
      </div>

      <form id="authForm">
        <div class="auth-field">
          <label for="emailInput" class="muted">Email Address</label>
          <input
            id="emailInput"
            type="email"
            class="input-field"
            placeholder="you@example.com"
            required
          />
        </div>

        <div class="auth-field">
          <label for="passwordInput" class="muted">Password</label>
          <input
            id="passwordInput"
            type="password"
            class="input-field"
            placeholder="Enter your password"
            minlength="6"
            required
          />
        </div>

        <div class="auth-actions">
          <button id="btnAuthSubmit" type="submit" class="btn">Sign In</button>
        </div>

        <div id="authMessage" class="muted" style="margin-top:12px;font-size:0.9rem;"></div>
        <div id="authError" class="alert-error hidden"></div>
      </form>
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    (function () {
      // Redirect target after authentication (easy to change later with your team)
      const REDIRECT_AFTER_AUTH = "threat-scan.html";

      let mode = "login"; // "login" or "signup"

      const tabs = document.querySelectorAll(".tab-btn");
      const authForm = document.getElementById("authForm");
      const emailInput = document.getElementById("emailInput");
      const passwordInput = document.getElementById("passwordInput");
      const btnSubmit = document.getElementById("btnAuthSubmit");
      const authMessage = document.getElementById("authMessage");
      const authError = document.getElementById("authError");

      function showError(msg) {
        authError.textContent = msg;
        authError.classList.remove("hidden");
        authMessage.textContent = "";
      }

      function showInfo(msg) {
        authError.textContent = "";
        authError.classList.add("hidden");
        authMessage.textContent = msg;
      }

      function clearNotices() {
        authError.textContent = "";
        authError.classList.add("hidden");
        authMessage.textContent = "";
      }

      function goToDestination() {
        window.location.href = REDIRECT_AFTER_AUTH;
      }

      tabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          clearNotices();
          tabs.forEach((t) => t.classList.remove("active"));
          tab.classList.add("active");
          mode = tab.dataset.mode;
          btnSubmit.textContent = mode === "login" ? "Sign In" : "Create Account";
        });
      });

      // If the user already has an active Supabase session, go straight to ThreatScan
      (async function checkExistingSession() {
        const supabase = window.CyvoraAuth?.getSupabaseClient();
        if (!supabase) return;
        const { data } = await supabase.auth.getSession();
        if (data?.session?.access_token) {
          goToDestination();
        }
      })();

      authForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        clearNotices();

        const supabase = window.CyvoraAuth?.getSupabaseClient();
        if (!supabase) {
          showError("Supabase client is not configured in frontend/assets/js/config.js.");
          return;
        }

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        btnSubmit.disabled = true;
        btnSubmit.textContent = mode === "login" ? "Signing in..." : "Creating account...";

        try {
          if (mode === "login") {
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) throw error;
            if (data?.session?.access_token) {
              goToDestination();
            }
          } else {
            const confirmationUrl = new URL("login.html?verified=1", window.location.href).toString();
            const { data, error } = await supabase.auth.signUp({
              email,
              password,
              options: { emailRedirectTo: confirmationUrl }
            });
            if (error) throw error;

            // If email confirmation is off in Supabase, a session is returned right away
            if (data?.session?.access_token) {
              goToDestination();
            } else {
              showInfo("Account created! Check your email to confirm your address, then sign in.");
            }
          }
        } catch (err) {
          showError(err.message || "Authentication failed.");
        } finally {
          btnSubmit.disabled = false;
          btnSubmit.textContent = mode === "login" ? "Sign In" : "Create Account";
        }
      });
    })();

  </script>
  <script src="assets/js/pwa.js"></script>
</body>
</html>
