<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CYVORA</title><meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{min-height:100vh;display:grid;place-items:center;background:#fff;color:#082b49}
.splash{text-align:center;padding:28px;width:min(92vw,520px);animation:appear .8s ease both}
.logo{width:min(86vw,380px);height:auto;animation:logoIn 1.2s cubic-bezier(.2,1.3,.4,1) both}
.tagline{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;margin:16px 0 30px;font-size:clamp(12px,3vw,15px);letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.tagline span:nth-child(2){color:#01aeca}.tagline span:nth-child(3){color:#f1330d}
.loading{display:flex;justify-content:center;gap:8px}.loading i{width:9px;height:9px;border-radius:50%;background:#082b49;animation:pulse .9s infinite alternate}.loading i:nth-child(2){animation-delay:.2s;background:#01aeca}.loading i:nth-child(3){animation-delay:.4s;background:#f1330d}
@keyframes pulse{to{transform:translateY(-7px);opacity:.45}}@keyframes logoIn{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)}}@keyframes appear{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><main class="splash" aria-label="Loading CYVORA">
<img class="logo" src="assets/images/cyvora-logo.jpeg" alt="CYVORA — Protect, Verify, Report">
<div class="tagline"><span>Protect</span><span>Verify</span><span>Report</span></div>
<div class="loading" aria-label="Loading"><i></i><i></i><i></i></div>
<p>Preparing your digital safety space…</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js"></script><script src="assets/js/auth.js"></script>
<script>
(async function(){try{await new Promise(r=>setTimeout(r,2300));const token=await window.CyvoraAuth.getBearerToken();location.replace(token?"threat-scan.html":"login.html");}catch(e){location.replace("login.html");}})();
</script></body></html>
