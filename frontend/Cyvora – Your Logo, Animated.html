<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cyvora – Protect, verify, report</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{--bg:#e8eef5;--fg:#00203e;--dot1:#00203e;--wmfill:#000;background:var(--bg);color:var(--fg);transition:background .3s,color .3s;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center}
body.dark{--bg:#17233a;--fg:#eaf1fb;--dot1:#fff;--wmfill:#fff}
body.check{--bg:#fff;background-image:linear-gradient(45deg,#d9d9d9 25%,transparent 25%,transparent 75%,#d9d9d9 75%),linear-gradient(45deg,#d9d9d9 25%,#fff 25%,#fff 75%,#d9d9d9 75%);background-size:24px 24px;background-position:0 0,12px 12px}
.wm{fill:var(--wmfill)}
.dark .tile{filter:drop-shadow(0 0 1.5px rgba(255,255,255,.7))}
main{padding:20px;width:100%;max-width:820px}
svg{width:100%;height:auto;overflow:visible;display:block}
.tile{opacity:0;transform-box:fill-box;transform-origin:center}
.play .tile{animation:tile .8s cubic-bezier(.2,1.3,.4,1) both}
@keyframes tile{from{opacity:0;transform:rotate(-50deg) scale(.3)}to{opacity:1;transform:none}}
.shock{fill:none;stroke:var(--fg);stroke-width:6;opacity:0;transform-box:fill-box;transform-origin:center}
.play .shock{animation:shock .9s .45s ease-out}
@keyframes shock{0%{opacity:.45;transform:scale(1)}100%{opacity:0;transform:scale(1.7)}}
.cm{fill:none;stroke:#fff;stroke-width:150;stroke-dasharray:1;stroke-dashoffset:1}
.play .cm{animation:draw .75s .6s ease both}
@keyframes draw{to{stroke-dashoffset:0}}
.cm2{fill:#fff;opacity:0}
.play .cm2{animation:fin .15s 1.2s both}
@keyframes fin{to{opacity:1}}
.cimg{opacity:0}
.play .cimg{animation:show .01s .6s both}
@keyframes show{to{opacity:1}}
.bb{transform-box:fill-box;transform-origin:center;transform:scale(0)}
.play .h1{animation:bp .45s 1.3s cubic-bezier(.3,1.9,.5,1) both}
.play .h2{animation:bp .45s 1.5s cubic-bezier(.3,1.9,.5,1) both}
.play .b1{animation:bp .45s 1.4s cubic-bezier(.3,1.9,.5,1) both}
.play .b2{animation:bp .45s 1.6s cubic-bezier(.3,1.9,.5,1) both}
.play .b3{animation:bp .45s 1.8s cubic-bezier(.3,1.9,.5,1) both,beat .5s 3s ease-in-out,beat .5s 3.4s ease-in-out}
@keyframes bp{to{transform:scale(1)}}
@keyframes beat{50%{transform:scale(1.5)}}
.wr{transform-box:fill-box;transform-origin:0 50%;transform:scaleX(0)}
.play .wr{animation:wipe .9s 2.1s cubic-bezier(.6,0,.3,1) both}
@keyframes wipe{to{transform:scaleX(1)}}
.scanline{fill:#01cdeb;opacity:0;filter:drop-shadow(0 0 8px #01cdeb)}
.play .scanline{animation:sl .9s 2.1s cubic-bezier(.6,0,.3,1) both}
@keyframes sl{0%{opacity:0;transform:translateX(0)}8%{opacity:1}92%{opacity:1}100%{opacity:0;transform:translateX(780px)}}
.ping{fill:none;stroke:#f1330d;stroke-width:4;opacity:0;transform-box:fill-box;transform-origin:center}
.play .pg1{animation:ping 1.1s 3s ease-out}
.play .pg2{animation:ping 1.1s 3.4s ease-out}
@keyframes ping{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(5)}}
.motto{margin-top:clamp(10px,2.5vw,22px);display:flex;justify-content:center;gap:clamp(12px,4vw,34px);flex-wrap:wrap;color:var(--fg);font-size:clamp(13px,3.6vw,19px);letter-spacing:.16em;text-transform:uppercase;font-weight:600}
.m{opacity:0;display:inline-flex;align-items:center;gap:9px}
.m i{width:.7em;height:.7em;border-radius:50%;display:inline-block;transform:scale(0)}
.m1 i{background:var(--dot1)}.m2 i{background:#01cdeb}.m3 i{background:#f1330d}
.play .m1{animation:mi .6s .2s both}.play .m2{animation:mi .6s 1.4s both}.play .m3{animation:mi .6s 3s both}
.play .m1 i{animation:dot .6s .2s both}.play .m2 i{animation:dot .6s 1.4s both}.play .m3 i{animation:dot .6s 3s both}
@keyframes mi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes dot{0%{transform:scale(0)}60%{transform:scale(1.6)}100%{transform:scale(1)}}
.btns{margin-top:28px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
button{font:inherit;font-size:14px;padding:11px 20px;border-radius:999px;border:1px solid var(--fg);background:transparent;color:var(--fg);cursor:pointer}
button.p{background:var(--fg);color:var(--bg);font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>
